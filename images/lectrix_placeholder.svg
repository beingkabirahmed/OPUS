<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141418" />
      <stop offset="100%" stop-color="#0a0a0c" />
    </linearGradient>
    <linearGradient id="electricOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#FACC15" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FACC15" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" rx="16" />

  <!-- Technical Grid -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="600" />
    <line x1="200" y1="0" x2="200" y2="600" />
    <line x1="300" y1="0" x2="300" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="500" y1="0" x2="500" y2="600" />
    <line x1="600" y1="0" x2="600" y2="600" />
    <line x1="700" y1="0" x2="700" y2="600" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="500" x2="800" y2="500" />
  </g>

  <!-- Ground Plane shadow / reflection -->
  <ellipse cx="400" cy="480" rx="260" ry="24" fill="#000000" opacity="0.8" filter="url(#glow)" />
  <ellipse cx="400" cy="480" rx="180" ry="12" fill="url(#neonGlow)" />

  <!-- Scooter Technical Blueprint Silhouette -->
  <!-- Rear Wheel -->
  <circle cx="260" cy="430" r="62" stroke="#2A2A32" stroke-width="14" fill="#141418" />
  <circle cx="260" cy="430" r="42" stroke="url(#electricOrange)" stroke-width="3" fill="none" opacity="0.9" />
  <circle cx="260" cy="430" r="16" fill="#F97316" />

  <!-- Front Wheel -->
  <circle cx="560" cy="430" r="62" stroke="#2A2A32" stroke-width="14" fill="#141418" />
  <circle cx="560" cy="430" r="42" stroke="url(#electricOrange)" stroke-width="3" fill="none" opacity="0.9" />
  <circle cx="560" cy="430" r="16" fill="#FACC15" />

  <!-- Main Chassis & Footboard -->
  <path d="M 260 410 L 370 410 L 480 395 L 530 290 L 515 220 L 535 210 L 555 285 L 560 410" 
        stroke="url(#electricOrange)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Rear Bodywork & Saddle -->
  <path d="M 230 360 C 260 320, 320 310, 390 315 L 430 355 L 350 380 Z" 
        fill="#1C1C24" stroke="#374151" stroke-width="2" />
  <path d="M 280 315 C 320 310, 360 310, 395 315 L 390 330 L 290 330 Z" 
        fill="url(#electricOrange)" opacity="0.85" />

  <!-- Handlebars & Headlamp Stem -->
  <line x1="515" y1="220" x2="495" y2="180" stroke="#F3F4F6" stroke-width="5" stroke-linecap="round" />
  <line x1="480" y1="180" x2="520" y2="180" stroke="#F3F4F6" stroke-width="6" stroke-linecap="round" />
  
  <!-- Futuristic Headlight Beam -->
  <polygon points="535,210 650,195 660,240 535,225" fill="url(#neonGlow)" opacity="0.5" />
  <circle cx="535" cy="217" r="8" fill="#FACC15" filter="url(#glow)" />

  <!-- Battery Module Compartment -->
  <rect x="330" y="365" width="85" height="42" rx="6" fill="#18181E" stroke="url(#electricOrange)" stroke-width="2" />
  <text x="372" y="391" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" fill="#FACC15" text-anchor="middle" letter-spacing="1">SWAP BATTERY</text>

  <!-- Technical Overlay Labels -->
  <rect x="40" y="40" width="220" height="44" rx="8" fill="#1C1C24" stroke="#2D3039" stroke-width="1" />
  <circle cx="58" cy="62" r="5" fill="#22C55E" />
  <text x="74" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#F3F4F6" letter-spacing="1">LECTRIX 2.0</text>
  <text x="74" y="73" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#9CA3AF">FLEET SPECIFICATION PREVIEW</text>

  <rect x="540" y="510" width="220" height="38" rx="6" fill="#16171D" stroke="#2A2C36" stroke-width="1" />
  <text x="650" y="534" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="600" fill="#F97316" text-anchor="middle" letter-spacing="0.5">ASSOCIATED SWAP ECOSYSTEM</text>
</svg>
